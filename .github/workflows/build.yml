name: Build Telegram Android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;20.1.5948944"

      - name: Change Package Name
        run: |
          OLD_PKG="org.telegram.messenger"
          NEW_PKG="com.spmods.spgram"

          OLD_PATH="TMessagesProj/src/main/java/org/telegram/messenger"
          NEW_PATH="TMessagesProj/src/main/java/com/spmods/spgram"

          # Java/Kotlin files වල package name replace කරනවා
          find TMessagesProj/src -type f \( -name "*.java" -o -name "*.kt" \) \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # XML files වල package name replace කරනවා (AndroidManifest, layouts, etc.)
          find TMessagesProj -type f -name "*.xml" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # Gradle files වල package name replace කරනවා
          find . -type f -name "*.gradle" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +
          find . -type f -name "*.gradle.kts" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # Folder structure rename කරනවා
          mkdir -p "$NEW_PATH"
          cp -r "$OLD_PATH/." "$NEW_PATH/"
          rm -rf "TMessagesProj/src/main/java/org"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Setup gradle.properties
        run: |
          cat >> gradle.properties << EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Update BuildVars (API ID & Hash)
        run: |
          sed -i 's/.*TELEGRAM_API_ID.*/public static int APP_ID = ${{ secrets.TELEGRAM_API_ID }};/' TMessagesProj/src/main/java/com/spmods/spgram/BuildVars.java
          sed -i 's/.*TELEGRAM_API_HASH.*/public static String APP_HASH = "${{ secrets.TELEGRAM_API_HASH }}";/' TMessagesProj/src/main/java/com/spmods/spgram/BuildVars.java

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APK
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
